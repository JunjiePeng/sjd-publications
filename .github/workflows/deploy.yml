name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh the complete publication and study catalogue
        type: boolean
        default: true
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/refresh_catalogue.py --allow-stale
      - run: python scripts/validate_catalogue.py
      - name: Save validated data or visible refresh-failure status
        run: |
          if git diff --quiet -- public/data; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          git commit -m 'Refresh SjD publication and study catalogue'
          git push origin HEAD:main
  build:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/validate_catalogue.py
      - run: node --experimental-strip-types --test scripts/test_filters.mjs
      - run: pnpm lint
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
